# main ブランチへ push されるたびに、ビルドして GitHub Pages へ自動デプロイする。
# 他のブランチや Pull Request ではビルドの検証だけを行う。
#
# デプロイはビルド成果物 (dist/) を gh-pages ブランチへ push する方式。
# GITHUB_TOKEN の contents: write 権限だけで動作し、Pages の事前設定が不要。
name: Build & Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # プロジェクトサイト (https://<owner>.github.io/<repo>/) 用のサブパス
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
